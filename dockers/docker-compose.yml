services:
  nginx:
    container_name: bedrock_nginx
    image: nginx
    volumes:
      - ../wordpress/:/usr/share/nginx/html/
      - ./etc/nginx/conf.d:/etc/nginx/conf.d
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf       
    tty: true
    ports:
     - "80:80"    
    links:
      - php
    networks:
      - bedrock_workgroup
        
  php:
    container_name: bedrock_php
    image: myridia/php8.4fpm
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_TABLE_PREFIX: dx36fd_
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
    volumes:
      - ../wordpress/:/usr/share/nginx/html/
      #- ../plugins/imageserver:/usr/share/nginx/html/wp-content/plugins/imageserver
    networks:
      - bedrock_workgroup
      
  db:
    image: mariadb    
    container_name: bedrock_db
    volumes:
      - db:/var/lib/mysql
      - "./init/:/docker-entrypoint-initdb.d"
      - "./etc/mysql/my.cnf:/etc/mysql/conf.d/my.cnf"   
    ports:
     - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - bedrock_workgroup

  wpcli:
    image: wordpress:cli    
    container_name: bedrock_wpcli
    command: >
      /bin/sh -c  '
      sleep 3;
      tail -F anything '
    user: root 
    links:
      - db:mysql

    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_TABLE_PREFIX: dx36fd_
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      memory: 3g
    volumes:
      - ../wordpress:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/php.ini      
    networks:
      - bedrock_workgroup
      
  phpmyadmin:
    container_name: bedrock_pma
    image: phpmyadmin/phpmyadmin
    ports:
      - "81:80"    
    environment:
      PMA_HOST: db 
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "./etc/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php"
    networks:
      - bedrock_workgroup
volumes:
  wordpress:
    name: bedrock_wordpress
  db:
    name: bedrock_db
    
networks:
  bedrock_workgroup:
    name: bedrock_workgroup
    driver: bridge
